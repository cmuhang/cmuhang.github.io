name: Update Google Scholar citations

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-citations:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the homepage
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Read citation counts
        run: python scripts/update_scholar_citations.py

      - name: Commit updated counts
        run: |
          if git diff --quiet -- _data/citations.json; then
            echo "No citation changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/citations.json
          git commit -m "Update Google Scholar citation counts"
          git push
